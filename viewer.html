<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Viewer | Riccardo Fusiello</title>
  
  <!-- Font & Icone del tuo tema -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Highlight.js (Evidenziazione Codice Dark) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  
  <!-- KaTeX (Per Formule Matematiche di ML) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

  <style>
    :root {
      --bg-deep: #0b001a;
      --bg-card: #120025;
      --neon-cyan: #00ffff;
      --neon-magenta: #ff00ff;
      --neon-purple: #8a2be2;
      --text-main: #e2d9f3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar Synthwave */
    .topbar {
      position: sticky;
      top: 0;
      height: 54px;
      background: rgba(18, 0, 37, 0.95);
      border-bottom: 2px solid var(--neon-magenta);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 20px rgba(255, 0, 255, 0.25);
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .doc-info {
      color: var(--neon-cyan);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-retro {
      font-family: 'VT323', monospace;
      font-size: 1.15rem;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      background: transparent;
      padding: 4px 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-retro:hover {
      background: var(--neon-cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    /* Area di Lettura Markdown */
    .content-wrapper {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* Stile Tipografico del Markdown */
    .markdown-body {
      line-height: 1.7;
      font-size: 1rem;
    }

    .markdown-body h1, 
    .markdown-body h2, 
    .markdown-body h3 {
      color: var(--neon-cyan);
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      border-bottom: 1px solid rgba(0, 255, 255, 0.2);
      padding-bottom: 6px;
    }

    .markdown-body h1 { font-size: 1.8rem; color: var(--neon-magenta); text-shadow: 0 0 8px rgba(255,0,255,0.4); }
    .markdown-body h2 { font-size: 1.4rem; }
    .markdown-body h3 { font-size: 1.15rem; }

    .markdown-body p { margin-bottom: 1.2em; }

    .markdown-body a { color: var(--neon-magenta); text-decoration: underline; }
    .markdown-body a:hover { text-shadow: 0 0 8px var(--neon-magenta); }

    .markdown-body ul, .markdown-body ol {
      margin-left: 25px;
      margin-bottom: 1.2em;
    }

    .markdown-body li { margin-bottom: 0.4em; }

    .markdown-body blockquote {
      border-left: 4px solid var(--neon-purple);
      padding-left: 15px;
      color: #a080c0;
      margin: 1.5em 0;
      font-style: italic;
    }

    /* Blocchi di Codice */
    .markdown-body pre {
      background: #140827 !important;
      border: 1px solid var(--neon-purple);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin: 1.5em 0;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .markdown-body code:not(pre code) {
      background: rgba(255, 0, 255, 0.15);
      color: #ff80df;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    /* Tabelle */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid rgba(138, 43, 226, 0.4);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body th {
      background: rgba(138, 43, 226, 0.2);
      color: var(--neon-cyan);
    }
  </style>
</head>
<body>

  <!-- Barra Superiore -->
  <div class="topbar">
    <div class="doc-info">
      <i class="fas fa-file-lines" style="color: var(--neon-magenta);"></i>
      <span id="docTitle">Caricamento appunto...</span>
    </div>
    <a href="index.html#docs" class="btn-retro"><i class="fas fa-arrow-left"></i> Portfolio</a>
  </div>

  <!-- Contenitore Markdown -->
  <main class="content-wrapper">
    <article class="markdown-body" id="mdContent">
      <p style="color: var(--neon-cyan);">Caricamento contenuti in corso...</p>
    </article>
  </main>

  <!-- Script CDN per parsing Markdown, Code & Math -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileName = params.get('file');

    const docTitle = document.getElementById('docTitle');
    const mdContent = document.getElementById('mdContent');

    if (fileName) {
      const decodedName = decodeURIComponent(fileName);
      const cleanTitle = decodedName.replace(/\.md$/i, '');
      docTitle.textContent = cleanTitle;
      document.title = cleanTitle + " | Note";

      // Effettua la fetch del file .md grezzo
      fetch('misc/docs/' + decodedName)
        .then(res => {
          if (!res.ok) throw new Error("Impossibile caricare il file Markdown.");
          return res.text();
        })
        .then(markdownText => {
          // 1. Converte il Markdown in HTML
          mdContent.innerHTML = marked.parse(markdownText);

          // 2. Colora i blocchi di codice
          hljs.highlightAll();

          // 3. Renderizza eventuali formule LaTeX ($...$ o $$...$$)
          if (window.renderMathInElement) {
            renderMathInElement(mdContent, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ],
              throwOnError: false
            });
          }
        })
        .catch(err => {
          mdContent.innerHTML = `
            <div style="border: 1px solid var(--neon-magenta); padding: 20px; background: rgba(255,0,255,0.05); border-radius: 4px;">
              <h3 style="color: var(--neon-magenta); margin-bottom: 10px;">Errore di caricamento</h3>
              <p>Non è stato possibile caricare il file: <code>misc/docs/${decodedName}</code></p>
              <p style="font-size: 0.85rem; color: #a080c0; margin-top: 10px;">Assicurati di testare tramite server locale (es. Live Server) o GitHub Pages, e che il file esista.</p>
            </div>
          `;
        });
    } else {
      mdContent.innerHTML = "<p>Nessun documento specificato nell'URL.</p>";
    }
  </script>
</body>
</html>
