<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer | Riccardo Fusiello</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b001a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Fira Code', monospace;
    }

    /* Topbar Vaporwave */
    .topbar {
      height: 52px;
      background: #120025;
      border-bottom: 2px solid #ff00ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 20px rgba(255, 0, 255, 0.3);
      z-index: 100;
    }

    .doc-info {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00ffff;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
    }

    .doc-info i {
      color: #ff00ff;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn-retro {
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      color: #00ffff;
      border: 1px solid #00ffff;
      background: transparent;
      padding: 3px 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-retro:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 10px #00ffff;
      color: #fff;
    }

    .btn-retro.pink {
      color: #ff00ff;
      border-color: #ff00ff;
    }

    .btn-retro.pink:hover {
      background: rgba(255, 0, 255, 0.2);
      box-shadow: 0 0 10px #ff00ff;
    }

    /* Contenitore documento */
    .frame-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 52px);
      background: #ffffff; /* Sfondo neutro per garantire la leggibilità di appunti Notion/Obsidian */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="doc-info">
      <i class="fas fa-file-code"></i>
      <span id="docTitle">Caricamento documento...</span>
    </div>
    <div class="actions">
      <a href="index.html#docs" class="btn-retro"><i class="fas fa-arrow-left"></i> Home</a>
      <a id="directLink" href="#" target="_blank" class="btn-retro pink"><i class="fas fa-external-link-alt"></i> File Grezzo</a>
    </div>
  </div>

  <div class="frame-container">
    <iframe id="docFrame" src="about:blank"></iframe>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileName = params.get('file');

    const docTitle = document.getElementById('docTitle');
    const docFrame = document.getElementById('docFrame');
    const directLink = document.getElementById('directLink');

    if (fileName) {
      const decodedName = decodeURIComponent(fileName);
      const filePath = 'misc/docs/' + decodedName;
      
      docFrame.src = filePath;
      directLink.href = filePath;
      
      const cleanTitle = decodedName.replace(/\.html$/i, '');
      docTitle.textContent = cleanTitle;
      document.title = cleanTitle + " | Note Viewer";
    } else {
      docTitle.textContent = "Nessun file specificato";
    }
  </script>
</body>
</html>
